<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Glou — Wiki</title>
<meta name="description" content="Glou technical documentation: installation, configuration, features, and troubleshooting." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍷</text></svg>" />
<script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
<style>
  :root{
    --bg:#fbf7f3;
    --bg-alt:#f3ece4;
    --ink:#241417;
    --ink-soft:#5b4a4e;
    --wine:#6e1423;
    --wine-deep:#4a0d18;
    --gold:#b8894f;
    --card:#ffffff;
    --border:#e7dcd2;
    --shadow:0 20px 40px -24px rgba(36,20,23,.35);
    --radius:14px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1c1113; --bg-alt:#231619; --ink:#f3e9e4; --ink-soft:#cbb2b7;
      --wine:#e0536b; --wine-deep:#ff7a8e; --gold:#d9a96a;
      --card:#271a1d; --border:#3a262b; --shadow:0 20px 40px -24px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1c1113; --bg-alt:#231619; --ink:#f3e9e4; --ink-soft:#cbb2b7;
    --wine:#e0536b; --wine-deep:#ff7a8e; --gold:#d9a96a;
    --card:#271a1d; --border:#3a262b; --shadow:0 20px 40px -24px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.6;}
  a{color:var(--wine-deep);}

  header.site{
    position:sticky; top:0; z-index:20;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  header.site .bar{
    max-width:1200px; margin:0 auto; padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:20px; font-weight:700; text-decoration:none; color:var(--ink);}
  .brand .mark{font-size:24px;}
  nav.top{display:flex; gap:20px; font-size:14px; align-items:center;}
  nav.top a{color:var(--ink-soft); text-decoration:none; font-weight:600;}
  nav.top a:hover{color:var(--wine);}
  .lang-toggle{display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden;}
  .lang-toggle button{
    border:none; background:var(--card); color:var(--ink-soft); font-weight:700; font-size:13px;
    padding:7px 14px; cursor:pointer;
  }
  .lang-toggle button.active{background:var(--wine); color:#fff;}
  button.menu-toggle{
    display:none; border:1px solid var(--border); background:var(--card); border-radius:8px;
    padding:7px 11px; font-size:16px; cursor:pointer; color:var(--ink);
  }

  .layout{max-width:1200px; margin:0 auto; display:grid; grid-template-columns:260px 1fr; gap:36px; padding:28px 20px 80px;}
  aside.toc{position:sticky; top:68px; align-self:start; max-height:calc(100vh - 90px); overflow-y:auto;}
  aside.toc ol{list-style:none; margin:0; padding:0; display:grid; gap:2px; counter-reset:wiki;}
  aside.toc li{counter-increment:wiki;}
  aside.toc a{
    display:flex; gap:8px; align-items:baseline;
    padding:8px 10px; border-radius:8px; font-size:14px; color:var(--ink-soft); text-decoration:none;
  }
  aside.toc a::before{content:counter(wiki); color:var(--gold); font-family:var(--mono); font-size:12px; min-width:18px;}
  aside.toc a:hover{background:var(--bg-alt); color:var(--ink);}
  aside.toc a.active{background:var(--wine); color:#fff; font-weight:700;}
  aside.toc a.active::before{color:#fcd9c3;}

  main.doc{min-width:0;}
  .doc-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:36px 40px; min-height:50vh;
  }
  @media (max-width:720px){ .doc-card{padding:24px 20px;} }

  .doc-card h1{font-family:var(--serif); font-size:30px; margin-top:0;}
  .doc-card h2{font-family:var(--serif); font-size:22px; border-top:1px solid var(--border); padding-top:22px; margin-top:30px;}
  .doc-card h3{font-size:18px;}
  .doc-card p, .doc-card li{color:var(--ink-soft); font-size:15px;}
  .doc-card code{
    background:var(--bg-alt); border:1px solid var(--border); border-radius:5px;
    padding:1px 6px; font-family:var(--mono); font-size:13px; color:var(--ink);
  }
  .doc-card pre{
    background:var(--wine-deep); border-radius:10px; padding:16px 18px; overflow-x:auto;
  }
  .doc-card pre code{background:none; border:none; color:#fdf2ee; padding:0;}
  .doc-card blockquote{
    margin:16px 0; padding:4px 16px; border-left:3px solid var(--gold);
    background:var(--bg-alt); border-radius:0 8px 8px 0; color:var(--ink-soft);
  }
  .doc-card table{border-collapse:collapse; width:100%; font-size:14px; margin:16px 0;}
  .doc-card th, .doc-card td{border:1px solid var(--border); padding:8px 10px; text-align:left;}
  .doc-card th{background:var(--bg-alt);}
  .doc-card img{max-width:100%; border-radius:10px;}
  .doc-nav{display:flex; justify-content:space-between; gap:12px; margin-top:24px; font-size:14px;}
  .doc-nav a{
    flex:1; border:1px solid var(--border); border-radius:10px; padding:12px 14px;
    text-decoration:none; color:var(--ink); background:var(--card);
  }
  .doc-nav a.next{text-align:right;}
  .doc-nav span{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft);}
  .doc-loading{color:var(--ink-soft); font-size:14px;}

  @media (max-width:860px){
    .layout{grid-template-columns:1fr;}
    aside.toc{
      position:fixed; inset:0 auto 0 0; top:62px; width:280px; max-height:none;
      background:var(--bg); border-right:1px solid var(--border); padding:16px;
      transform:translateX(-100%); transition:transform .2s ease; z-index:15;
      box-shadow:var(--shadow);
    }
    aside.toc.open{transform:translateX(0);}
    button.menu-toggle{display:inline-block;}
  }
</style>
</head>
<body>

<header class="site">
  <div class="bar">
    <a class="brand" href="index.html"><span class="mark">🍷</span> Glou</a>
    <nav class="top">
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle table of contents">☰</button>
      <a href="index.html">Home</a>
      <a href="https://github.com/jackthomasanderson/glou-server">GitHub</a>
      <div class="lang-toggle">
        <button id="btnEN" class="active">EN</button>
        <button id="btnFR">FR</button>
      </div>
    </nav>
  </div>
</header>

<div class="layout">
  <aside class="toc" id="toc"></aside>
  <main class="doc">
    <div class="doc-card">
      <div id="content" class="doc-loading">Loading…</div>
    </div>
    <div class="doc-nav" id="docNav"></div>
  </main>
</div>

<script>
const WIKI = {
  en: {
    dir: "wiki/EN",
    items: [
      ["01-Installation.md", "Installation"],
      ["02-Configuration.md", "Configuration"],
      ["03-Troubleshooting.md", "Troubleshooting"],
      ["04-Cellar-Management.md", "Cellar Management"],
      ["05-Bottle-Addition.md", "Bottle Addition"],
      ["06-Peak-Maturity-Alerts.md", "Peak Maturity Alerts"],
      ["07-Global-Search.md", "Global Search"],
      ["08-Autocomplete-Image.md", "Autocomplete & Image Search"],
      ["09-Tasting-Journal.md", "Tasting Journal"],
      ["10-Audit-Log.md", "Audit Log"],
      ["11-Sessions-Trusted-Devices.md", "Sessions & Trusted Devices"],
      ["12-Security-Notifications.md", "Security Notifications"],
      ["13-Quick-Lock-Auto-Lock.md", "Quick Lock & Auto-Lock"],
      ["14-Guest-Sharing-Write-Access.md", "Guest Sharing: Read/Write Access"],
      ["15-Data-Retention-Maintenance.md", "Data Retention & Maintenance"],
      ["16-Network-Public-URL-Configuration.md", "Network & Public URL Configuration"],
      ["17-Onboarding-Setup-Wizard.md", "Onboarding Setup Wizard"],
      ["18-Field-Source-Transparency-History.md", "Field Source Transparency & History"],
      ["19-Backups-Export-Data-Portability.md", "Backups, Export & Data Portability"],
      ["20-World-Map-Heatmap-Filters.md", "World Map, Heatmap & Filters"],
      ["21-Food-Pairing.md", "Food Pairing"],
      ["22-Consumption-Plan.md", "Consumption Plan"],
      ["23-Physical-Inventory-Reconciliation.md", "Physical Inventory & Reconciliation"],
      ["24-Wishlist-Budget.md", "Wishlist & Budget"],
      ["25-Offline-Mode.md", "Offline Mode"],
      ["26-Label-Scan.md", "Label Scan"],
      ["27-Expert-Mode.md", "Expert Mode"],
      ["01-Authentication.md", "Authentication (API)"],
      ["29-Secret-Rotation.md", "Rotate the Secrets"],
      ["30-Disaster-Recovery.md", "Disaster Recovery"],
      ["31-Upgrades-And-Rollback.md", "Upgrade & Roll Back"]
    ]
  },
  fr: {
    dir: "wiki/FR",
    items: [
      ["01-Installation.md", "Installation"],
      ["02-Configuration.md", "Configuration"],
      ["03-Depannage.md", "Dépannage"],
      ["04-Gestion-Des-Caves.md", "Gestion des Caves"],
      ["05-Ajout-Bouteille.md", "Ajouter une Bouteille"],
      ["06-Alertes-Apogee.md", "Alertes Apogée"],
      ["07-Recherche-Globale.md", "Recherche Globale"],
      ["08-Autocompletion-Image.md", "Autocomplétion & Recherche d'Image"],
      ["09-Journal-Degustation.md", "Journal de Dégustation"],
      ["10-Audit-Actions.md", "Journal d'Audit des Actions"],
      ["11-Sessions-Appareils-De-Confiance.md", "Sessions & Appareils de Confiance"],
      ["12-Notifications-De-Securite.md", "Notifications de Sécurité"],
      ["13-Verrouillage-Rapide-Auto-Lock.md", "Verrouillage Rapide & Auto-Lock"],
      ["14-Partage-Invite-Acces-Ecriture.md", "Partage Invité en Lecture/Écriture"],
      ["15-Retention-Maintenance-Donnees.md", "Rétention & Maintenance des Données"],
      ["16-Configuration-Reseau-URL-Publique.md", "Configuration Réseau & URL Publique"],
      ["17-Assistant-Onboarding.md", "Assistant de Configuration Initiale (Onboarding)"],
      ["18-Transparence-Sources-Historique.md", "Transparence des Sources & Historique"],
      ["19-Sauvegardes-Export-Portabilite-Donnees.md", "Sauvegardes, Export & Portabilité"],
      ["20-Carte-Monde-Heatmap-Filtres.md", "Carte du Monde, Heatmap & Filtres"],
      ["21-Accords-Mets-Bouteilles.md", "Accords Mets/Bouteilles"],
      ["22-Plan-De-Consommation.md", "Plan de Consommation"],
      ["23-Inventaire-Physique-Reconciliation.md", "Inventaire Physique & Réconciliation"],
      ["24-Liste-De-Souhaits-Budget.md", "Liste de Souhaits & Budget"],
      ["25-Mode-Hors-Ligne.md", "Mode Hors-Ligne"],
      ["26-Scan-Etiquette.md", "Scan Étiquette"],
      ["27-Mode-Expert.md", "Mode Expert"],
      ["01-Authentification.md", "Authentification (API)"],
      ["29-Rotation-Des-Secrets.md", "Changer les Secrets"],
      ["30-Reprise-Apres-Sinistre.md", "Reprise après Sinistre"],
      ["31-Mises-A-Jour-Et-Retour-Arriere.md", "Mettre à Jour & Revenir en Arrière"]
    ]
  }
};

let lang = "en";
let activeIndex = 0;
const tocEl = document.getElementById("toc");
const contentEl = document.getElementById("content");
const docNavEl = document.getElementById("docNav");

function renderTOC(){
  const { items } = WIKI[lang];
  tocEl.innerHTML = "<ol>" + items.map((it, i) =>
    `<li><a href="#" data-i="${i}" class="${i === activeIndex ? 'active' : ''}">${it[1]}</a></li>`
  ).join("") + "</ol>";
  tocEl.querySelectorAll("a").forEach(a => {
    a.addEventListener("click", e => {
      e.preventDefault();
      loadDoc(lang, parseInt(a.dataset.i, 10));
      tocEl.classList.remove("open");
    });
  });
}

function renderDocNav(){
  const { items } = WIKI[lang];
  const prev = items[activeIndex - 1];
  const next = items[activeIndex + 1];
  docNavEl.innerHTML =
    (prev ? `<a href="#" id="prevLink"><span>← Previous</span>${prev[1]}</a>` : "<span></span>") +
    (next ? `<a href="#" id="nextLink" class="next"><span>Next →</span>${next[1]}</a>` : "");
  const prevLink = document.getElementById("prevLink");
  const nextLink = document.getElementById("nextLink");
  if (prevLink) prevLink.addEventListener("click", e => { e.preventDefault(); loadDoc(lang, activeIndex - 1); });
  if (nextLink) nextLink.addEventListener("click", e => { e.preventDefault(); loadDoc(lang, activeIndex + 1); });
}

async function loadDoc(l, i){
  lang = l;
  activeIndex = i;
  const { dir, items } = WIKI[lang];
  const [file] = items[i];
  location.hash = `${lang}/${file.replace(/\.md$/, "")}`;
  contentEl.innerHTML = "Loading…";
  contentEl.className = "doc-loading";
  try{
    const res = await fetch(`${dir}/${file}`);
    if (!res.ok) throw new Error(res.status);
    const md = await res.text();
    contentEl.innerHTML = marked.parse(md);
    contentEl.className = "";
  }catch(err){
    contentEl.innerHTML = `<p>Could not load this page (${err.message}). <a href="https://github.com/jackthomasanderson/glou-server/blob/main/docs/${dir}/${file}">View it on GitHub</a> instead.</p>`;
    contentEl.className = "";
  }
  renderTOC();
  renderDocNav();
  document.getElementById("btnEN").classList.toggle("active", lang === "en");
  document.getElementById("btnFR").classList.toggle("active", lang === "fr");
  window.scrollTo({ top: 0, behavior: "instant" });
}

function findByHash(){
  const h = location.hash.replace(/^#/, "");
  const [l, file] = h.split("/");
  if (l && WIKI[l]) {
    const idx = WIKI[l].items.findIndex(it => it[0].replace(/\.md$/, "") === file);
    if (idx >= 0) return { l, idx };
  }
  return { l: "en", idx: 0 };
}

document.getElementById("btnEN").addEventListener("click", () => loadDoc("en", 0));
document.getElementById("btnFR").addEventListener("click", () => loadDoc("fr", 0));
document.getElementById("menuToggle").addEventListener("click", () => tocEl.classList.toggle("open"));

const start = findByHash();
loadDoc(start.l, start.idx);
</script>

</body>
</html>
