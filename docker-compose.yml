services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-glou}
      # No fallback secret: compose fails fast if DB_PASSWORD is unset.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set. Copy .env.example to .env and set a real DB_PASSWORD before starting.}
      POSTGRES_DB: ${DB_NAME:-glou_db}
    # Small household instance: fewer connections / buffers than Postgres defaults.
    command: ["postgres", "-c", "max_connections=20", "-c", "shared_buffers=64MB"]
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-glou} -d ${DB_NAME:-glou_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Not published to the host/LAN. Debug: docker compose exec db psql -U glou -d glou_db
    expose:
      - "5432"
    logging: &logging
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: ghcr.io/jackthomasanderson/glou-server-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${DB_USER:-glou}:${DB_PASSWORD:?DB_PASSWORD is not set. Copy .env.example to .env and set a real DB_PASSWORD before starting.}@db:5432/${DB_NAME:-glou_db}
      JWT_SECRET: ${JWT_SECRET}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # ISSUE_054: this was never actually reaching the container, so setting
      # it in .env silently did nothing — the API stayed pinned to its
      # localhost:3000 fallback.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # Extra browser addresses allowed to send requests (comma-separated), e.g. a second hostname. Empty = APP_URL only (plus the host the request was addressed to).
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      # Empty = Secure cookies only when APP_URL is https://. Set true if TLS is terminated upstream while APP_URL says http.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      # Only used by label scan; see the `scan` profile below.
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      PORT: 3001
    # ISSUE_016: the browser never calls the API directly (web/lib/api.ts
    # uses the relative /api path, rewritten server-side by Next — see
    # NEXT_PUBLIC_API_URL above), so this port doesn't need to be reachable
    # from the host or the LAN. `expose` keeps it reachable from the `web`
    # container over the compose network without publishing it externally;
    # kept as `ports` in docker-compose.dev.yml, where direct access is useful.
    expose:
      - "3001"
    volumes:
      - api_logs:/app/logs
      - api_uploads:/app/uploads
      - api_backups:/app/backups
    logging: *logging

  web:
    image: ghcr.io/jackthomasanderson/glou-server-web:latest
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:3001}
    ports:
      - "3000:3000"
    logging: *logging

  # Optional label scan (moondream vision model). Heavy: ~9 GB of disk,
  # ~3 GB of RAM. Enable with: docker compose --profile scan up -d
  ollama:
    profiles: ["scan"]
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # Unload the model after 5 min idle; one model, one scan at a time.
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *logging

  # One-shot: downloads the model (~1.7 GB) into ollama_data, then exits (0).
  ollama-pull:
    profiles: ["scan"]
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-moondream}"]

volumes:
  db_data:
  api_logs:
  api_uploads:
  api_backups:
  ollama_data:
