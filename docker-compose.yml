services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-glou}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-glou_secret}
      POSTGRES_DB: ${DB_NAME:-glou_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-glou} -d ${DB_NAME:-glou_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "5432:5432"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # FEAT-04: self-hosted vision LLM (moondream) for the label-scan pipeline.
  # Not exposed publicly (`expose`, not `ports`) — only `api` talks to it, over
  # the internal compose network. First startup: `ollama-pull` below downloads
  # the ~1.7GB `moondream` model into the named `ollama_data` volume so it
  # survives container recreation; this can take a few minutes depending on
  # bandwidth, during which the scan feature will fail until it completes.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # One-shot: pulls the `moondream` model once `ollama` is healthy, then
  # exits (0). Compose leaves it "Exited (0)" afterwards — expected, not an
  # error. Re-running on an already-pulled model is a fast no-op, so it's
  # safe to leave in the stack permanently rather than pulling it back out
  # after first run.
  ollama-pull:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    command: ["pull", "moondream"]

  api:
    image: ghcr.io/jackthomasanderson/glou-server-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${DB_USER:-glou}:${DB_PASSWORD:-glou_secret}@db:5432/${DB_NAME:-glou_db}
      JWT_SECRET: ${JWT_SECRET}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY}
      APP_URL: ${APP_URL:-http://localhost:3000}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      PORT: 3001
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    ports:
      - "3001:3001"
    volumes:
      - api_logs:/app/logs
      - api_uploads:/app/uploads
      # FEAT-18: scheduled pg_dump backups, on their own named volume so they
      # persist independently of the app data/upload volumes and outside the
      # container filesystem (design.md "Sauvegarde & Migration").
      - api_backups:/app/backups
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ghcr.io/jackthomasanderson/glou-server-web:latest
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:3001}
    ports:
      - "3000:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
    driver: local
  api_logs:
    driver: local
  api_uploads:
    driver: local
  api_backups:
    driver: local
  ollama_data:
    driver: local
