name: Nightly UI Fuzz (gremlins)

# The gremlins horde clicks destructive controls at random, so it runs on its
# own schedule against a throwaway stack rather than on every PR. A failure
# here means a page threw an uncaught exception / logged a console error /
# hit a crash screen under fuzzing — check the uploaded report + the seed.

on:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC daily (off the hour, low-traffic window)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the E2E images
        run: docker compose -f docker-compose.e2e.yml build

      - name: Start the E2E stack
        run: docker compose -f docker-compose.e2e.yml up -d

      - name: Wait for the API and web app to come up
        run: |
          ok_api=0; ok_web=0
          for i in $(seq 1 80); do
            [ "$ok_api" = 0 ] && curl -sf -o /dev/null http://localhost:3001/health && { echo "api up ($i)"; ok_api=1; }
            [ "$ok_web" = 0 ] && curl -sf -o /dev/null http://localhost:3000/login && { echo "web up ($i)"; ok_web=1; }
            [ "$ok_api" = 1 ] && [ "$ok_web" = 1 ] && exit 0
            sleep 3
          done
          echo "stack did not come up in time"
          docker compose -f docker-compose.e2e.yml ps
          docker compose -f docker-compose.e2e.yml logs --tail=150
          exit 1

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run the gremlins fuzz
        working-directory: e2e
        env:
          CI: 'true'
          E2E_MONKEY: '1'
        run: npx playwright test monkey.spec.ts

      - name: Upload fuzz report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-report
          path: e2e/playwright-report
          retention-days: 14

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
