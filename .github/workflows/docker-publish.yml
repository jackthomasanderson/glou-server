name: Build & Publish Docker Images

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege default for GITHUB_TOKEN: the `test` job only needs to read
# the checked-out code. `build-and-push` re-grants `packages: write` for itself.
permissions:
  contents: read

env:
  IMAGE_API: ghcr.io/jackthomasanderson/glou-server-api
  IMAGE_WEB: ghcr.io/jackthomasanderson/glou-server-web
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Generate Prisma client
        working-directory: api
        run: npx prisma generate

      # Fails fast on type errors before the (slower) test suite runs. This
      # was previously only caught later, inside the Docker build stage of
      # build-and-push (`npm run build` -> tsc) — same compiler, same
      # tsconfig, just surfaced ~a build later than necessary. No new
      # dependency: uses the `typescript` devDependency already installed.
      - name: Typecheck API
        working-directory: api
        run: npm run typecheck

      # New: api/ had zero lint tooling before this. Config is
      # api/eslint.config.mjs (typescript-eslint recommended +
      # no-explicit-any, matching instructions.md's "aucun any toléré";
      # no-unused-vars with an _-prefix / err(or) allowance matching the
      # existing catch-block convention; no-explicit-any relaxed for
      # tests/** where it's Prisma-mock scaffolding, not app logic).
      # Verified clean (0 errors) against the current src/ and tests/ via a
      # standalone eslint install — not run through npm here.
      - name: Lint API
        working-directory: api
        run: npm run lint

      - name: Run API tests
        working-directory: api
        run: npm test

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # `next build` already runs ESLint by default and fails the build on
      # errors (no eslint.ignoreDuringBuilds override in next.config.mjs),
      # so this was already an implicit gate inside build-and-push — this
      # just surfaces it earlier, in the fast job, with a clearer failure.
      - name: Lint web
        working-directory: web
        run: npm run lint

      # `next build` type-checks the project (test files included, per
      # tsconfig's `**/*.ts(x)` globs) and fails the build on any error — an
      # implicit gate inside build-and-push / the e2e stack build. Surfacing
      # it here, in the fast job, catches a broken test-file type before a
      # ~4-min Docker build does. Same rationale as "Typecheck API" above.
      - name: Typecheck web
        working-directory: web
        run: npm run typecheck

      - name: Run web tests
        working-directory: web
        run: npm test

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the E2E images
        run: docker compose -f docker-compose.e2e.yml build

      - name: Start the E2E stack
        run: docker compose -f docker-compose.e2e.yml up -d

      - name: Wait for the API and web app to come up
        run: |
          ok_api=0; ok_web=0
          for i in $(seq 1 80); do
            [ "$ok_api" = 0 ] && curl -sf -o /dev/null http://localhost:3001/health && { echo "api up ($i)"; ok_api=1; }
            [ "$ok_web" = 0 ] && curl -sf -o /dev/null http://localhost:3000/login && { echo "web up ($i)"; ok_web=1; }
            [ "$ok_api" = 1 ] && [ "$ok_web" = 1 ] && exit 0
            sleep 3
          done
          echo "stack did not come up in time"
          docker compose -f docker-compose.e2e.yml ps
          docker compose -f docker-compose.e2e.yml logs --tail=150
          exit 1

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # Deterministic user-journey specs only. The gremlins fuzz
      # (monkey.spec.ts) is gated behind E2E_MONKEY and runs in the
      # `nightly-e2e-fuzz` workflow instead — it's slow and non-deterministic.
      - name: Run Playwright user-journey suite
        working-directory: e2e
        env:
          CI: 'true'
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  build-and-push:
    needs: test
    # Pull requests only run `test`; images are built and pushed on merge to
    # dev/main, not from PR branches (and a forked PR has no GHCR write token).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=beta,enable=${{ github.ref_name == 'dev' }}

      - name: Extract metadata (Web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_WEB }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=beta,enable=${{ github.ref_name == 'dev' }}

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://api:3001
          cache-from: type=gha
          cache-to: type=gha,mode=max
