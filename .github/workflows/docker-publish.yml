name: Build & Publish Docker Images

on:
  push:
    branches: [main, dev]
  pull_request:
    # feat/families, feat/slots: integration branches of the family model
    # (#471) and of several plan slots per line (FEAT-93, #847); their lot PRs
    # run the test job, publishing stays limited to pushes on main/dev.
    branches: [main, dev, feat/families, feat/slots]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege default for GITHUB_TOKEN: the `test` job only needs to read
# the checked-out code. `build-and-push` and `publish-manifest` re-grant `packages: write`.
permissions:
  contents: read

env:
  IMAGE_API: ghcr.io/jackthomasanderson/glou-server-api
  IMAGE_WEB: ghcr.io/jackthomasanderson/glou-server-web
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      geo_month: ${{ steps.geo.outputs.month }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # #434: month of the DB-IP database baked into the API image, read once
      # so the amd64 and arm64 builds embed the same file (see api/Dockerfile).
      - name: Pick the IP geolocation database month
        id: geo
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      # ISSUE_105: scans the checked-out tree for committed secrets before
      # anything else runs. The CLI directly, not gitleaks/gitleaks-action —
      # that wrapper requires a paid GITLEAKS_LICENSE on anything but a public
      # repo, which this project doesn't carry. `--no-git`: this repo's history
      # already carries one known, documented throwaway value (see
      # .gitleaksignore) that a history scan can't allowlist the same way.
      - name: Scan for leaked secrets
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.29.1/gitleaks_8.29.1_linux_x64.tar.gz
          echo "e4eb209d04e20339d77122a3bdf9cd41351255cfb27ebcb75e85325e04f88924  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-git --redact -v

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      # ISSUE_005: nothing in CI checked for known-vulnerable dependencies.
      # Scoped to --omit=dev (devDependencies never ship in the image built
      # below) and --audit-level=critical: at `high`, long-standing advisories
      # with no fixed version upstream would make this check permanently red
      # rather than catch a real regression. What remains at `high` is the
      # @ducanh2912/next-pwa -> braces chain (no patched `braces` release
      # exists) and i18next-http-backend's URL validation; the
      # `@prisma/config` -> deepmerge-ts chain is now pinned through an
      # `overrides` entry in api/package.json. Revisit the threshold once
      # fixed versions land upstream.
      - name: Audit API dependencies
        working-directory: api
        run: npm audit --omit=dev --audit-level=critical

      - name: Generate Prisma client
        working-directory: api
        run: npx prisma generate

      # Fails fast on type errors before the (slower) test suite runs. This
      # was previously only caught later, inside the Docker build stage of
      # build-and-push (`npm run build` -> tsc) — same compiler, same
      # tsconfig, just surfaced ~a build later than necessary. No new
      # dependency: uses the `typescript` devDependency already installed.
      - name: Typecheck API
        working-directory: api
        run: npm run typecheck

      # New: api/ had zero lint tooling before this. Config is
      # api/eslint.config.mjs (typescript-eslint recommended +
      # no-explicit-any, matching instructions.md's "aucun any toléré";
      # no-unused-vars with an _-prefix / err(or) allowance matching the
      # existing catch-block convention; no-explicit-any relaxed for
      # tests/** where it's Prisma-mock scaffolding, not app logic).
      # Verified clean (0 errors) against the current src/ and tests/ via a
      # standalone eslint install — not run through npm here.
      - name: Lint API
        working-directory: api
        run: npm run lint

      - name: Run API tests
        working-directory: api
        run: npm test

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # ISSUE_005: same rationale as "Audit API dependencies" above.
      - name: Audit web dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=critical

      # `next build` already runs ESLint by default and fails the build on
      # errors (no eslint.ignoreDuringBuilds override in next.config.mjs),
      # so this was already an implicit gate inside build-and-push — this
      # just surfaces it earlier, in the fast job, with a clearer failure.
      - name: Lint web
        working-directory: web
        run: npm run lint

      # `next build` type-checks the project (test files included, per
      # tsconfig's `**/*.ts(x)` globs) and fails the build on any error — an
      # implicit gate inside build-and-push / the e2e stack build. Surfacing
      # it here, in the fast job, catches a broken test-file type before a
      # ~4-min Docker build does. Same rationale as "Typecheck API" above.
      - name: Typecheck web
        working-directory: web
        run: npm run typecheck

      - name: Run web tests
        working-directory: web
        run: npm test

      # #534: THIRD_PARTY_NOTICES.md must describe what the images ship.
      # Regenerated from the production trees installed above; on a
      # mismatch the fresh file is uploaded so it can be committed as is.
      - name: Check third-party notices are up to date
        run: node scripts/generate-notices.mjs && git diff --exit-code THIRD_PARTY_NOTICES.md

      - name: Upload regenerated third-party notices
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: third-party-notices
          path: THIRD_PARTY_NOTICES.md
          retention-days: 7

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      # #627: Playwright strips types without checking them, so a type error
      # in a spec only surfaced when that line ran, or never. Checked before
      # the ~4-min image build so it fails fast.
      - name: Typecheck E2E
        working-directory: e2e
        run: npm run typecheck

      - name: Build the E2E images
        run: docker compose -f docker-compose.e2e.yml build

      # #537: same step as the install guide; without it Docker creates
      # ./backups as root and the API (uid 1001) cannot write backups.
      - name: Create the backups folder
        run: mkdir -p backups && sudo chown 1001:1001 backups

      - name: Start the E2E stack
        run: docker compose -f docker-compose.e2e.yml up -d

      - name: Wait for the API and web app to come up
        run: |
          ok_api=0; ok_web=0
          for i in $(seq 1 80); do
            [ "$ok_api" = 0 ] && curl -sf -o /dev/null http://localhost:3001/health && { echo "api up ($i)"; ok_api=1; }
            [ "$ok_web" = 0 ] && curl -sf -o /dev/null http://localhost:3000/login && { echo "web up ($i)"; ok_web=1; }
            [ "$ok_api" = 1 ] && [ "$ok_web" = 1 ] && exit 0
            sleep 3
          done
          echo "stack did not come up in time"
          docker compose -f docker-compose.e2e.yml ps
          docker compose -f docker-compose.e2e.yml logs --tail=150
          exit 1

      # #471: the families migrations replayed on a small instance at the
      # previous schema, in its own database, through the image just built
      # (e2e/migration/). Before the suite: it fails in seconds.
      - name: Migration bench (families)
        run: bash e2e/migration/check-families-migration.sh

      # FEAT-93: the slots migration (several cellar-plan cells per unit)
      # replayed the same way, on an instance at the families schema.
      - name: Migration bench (slots)
        run: bash e2e/migration/check-slots-migration.sh

      # #668: avatars saved with an absolute localhost address become relative.
      - name: Migration bench (avatar addresses)
        run: bash e2e/migration/check-avatar-url-migration.sh

      # #589: the units already finished keep their dating (finishedAt/finishedBy backfill).
      - name: Migration bench (finished stamp)
        run: bash e2e/migration/check-finished-at-migration.sh

      # #848: each wine's movement journal starts with its units in stock.
      - name: Migration bench (movement journal)
        run: bash e2e/migration/check-stock-movements-migration.sh

      # #981: admins who got member account notices through `security` keep them.
      - name: Migration bench (members notification category)
        run: bash e2e/migration/check-members-category-migration.sh

      # #468: sensor readings become manual ones; legacy labels become collections.
      - name: Migration bench (legacy fields)
        run: bash e2e/migration/check-legacy-fields-migration.sh

      # #588: the retention purge keeps the history of bottles and wines.
      - name: History survives the audit-log retention purge
        run: bash e2e/check-history-retention.sh

      # Deterministic user-journey specs only. The gremlins fuzz
      # (monkey.spec.ts) is gated behind E2E_MONKEY and runs in the
      # `nightly-e2e-fuzz` workflow instead — it's slow and non-deterministic.
      #
      # Runs inside Playwright's official image, which already carries the
      # browsers and their system libraries. `playwright install --with-deps`
      # pulled ~190 apt packages from the Azure Ubuntu mirror, which
      # intermittently crawled at ~40 kB/s and stretched this step to 30-50 min.
      # The image tag follows the version npm ci just installed, so a
      # Playwright bump needs no change here. `--network host` reaches the
      # stack on localhost:3000/3001.
      - name: Run Playwright user-journey suite
        working-directory: e2e
        timeout-minutes: 20
        run: |
          version=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          docker run --rm --network host --ipc=host -e CI=true \
            -v "$PWD":/e2e -w /e2e \
            "mcr.microsoft.com/playwright:v${version}-noble" \
            npx playwright test

      # #665: the disaster-recovery page's restore command, run as written on
      # the backup the backup-restore spec downloaded, into an empty database.
      - name: Restore a downloaded backup with the documented command
        run: bash e2e/check-documented-restore.sh

      # FEAT-94: the API image backs the database up before pending
      # migrations, and does not start (nothing migrated) when it cannot.
      - name: Check the backup taken before migrating
        run: bash e2e/check-pre-migration-backup.sh

      # #673: the stop signal reaches Node, so the graceful shutdown runs.
      # Last check against the stack: it stops the API.
      - name: Check the API's graceful shutdown
        run: bash e2e/check-graceful-shutdown.sh

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  build-and-push:
    # #539: the user-journey suite gates publishing — a commit that breaks
    # sign-in or restore must not reach `latest`/`beta`.
    needs: [test, e2e]
    # Pull requests only run `test`; images are built and pushed on merge to
    # dev/main, not from PR branches (and a forked PR has no GHCR write token).
    if: github.event_name == 'push'
    # #538 (decision on #394): images also ship for linux/arm64 (Raspberry Pi,
    # ARM NAS). Each architecture builds on a native runner instead of QEMU
    # emulation, which took ~35 min and sometimes hung for hours. Each job
    # pushes its image by digest only; `publish-manifest` then tags them
    # together as one multi-arch image.
    strategy:
      fail-fast: true
      matrix:
        image: [api, web]
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ matrix.image == 'api' && env.IMAGE_API || env.IMAGE_WEB }}
          labels: |
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./${{ matrix.image }}
          # #466: contracts shared between api/ and web/, see the Dockerfiles.
          build-contexts: |
            shared=./shared
          platforms: linux/${{ matrix.platform.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.image == 'web' && 'NEXT_PUBLIC_API_URL=http://api:3001' || format('GEO_MONTH={0}', needs.test.outputs.geo_month) }}
          outputs: type=image,name=${{ matrix.image == 'api' && env.IMAGE_API || env.IMAGE_WEB }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform.arch }}
          provenance: true
          sbom: true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests-${{ matrix.image }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    # Joins the per-architecture images of `build-and-push` under the release
    # tags (`latest`/`beta`/`vX`/sha), so `docker pull` picks the host's arch.
    needs: build-and-push
    strategy:
      matrix:
        image: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # CONTRIBUTING.md#versioning: api/ and web/ package.json always carry
      # the same CalVer string; read it once so a release build on `main`
      # also gets tagged `vYYYY.MM[.PATCH]` next to `latest`.
      - name: Read package version
        id: version
        run: echo "value=$(node -p "require('./api/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ matrix.image == 'api' && env.IMAGE_API || env.IMAGE_WEB }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=beta,enable=${{ github.ref_name == 'dev' }}
            type=raw,value=v${{ steps.version.outputs.value }},enable=${{ github.ref_name == 'main' }}
            type=sha,format=long

      - name: Create and push multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ matrix.image == 'api' && env.IMAGE_API || env.IMAGE_WEB }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "$TAGS"
          for digest in *; do
            args+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect manifest
        env:
          IMAGE: ${{ matrix.image == 'api' && env.IMAGE_API || env.IMAGE_WEB }}
          SHA: ${{ github.sha }}
        run: docker buildx imagetools inspect "$IMAGE:sha-$SHA"
