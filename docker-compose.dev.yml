services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-glou}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set. Copy .env.example to .env and set a real DB_PASSWORD before starting.}
      POSTGRES_DB: ${DB_NAME:-glou_db}
    command: ["postgres", "-c", "max_connections=20", "-c", "shared_buffers=64MB"]
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-glou} -d ${DB_NAME:-glou_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    expose:
      - "5432"

  api:
    image: ghcr.io/jackthomasanderson/glou-server-api:beta
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${DB_USER:-glou}:${DB_PASSWORD:?DB_PASSWORD is not set. Copy .env.example to .env and set a real DB_PASSWORD before starting.}@db:5432/${DB_NAME:-glou_db}
      JWT_SECRET: ${JWT_SECRET}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY}
      APP_URL: ${APP_URL:-http://localhost:3000}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - api_uploads:/app/uploads
      - api_backups:/app/backups

  web:
    image: ghcr.io/jackthomasanderson/glou-server-web:beta
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:3001}
    ports:
      - "3000:3000"

  # Optional label scan: docker compose -f docker-compose.dev.yml --profile scan up -d
  ollama:
    profiles: ["scan"]
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  ollama-pull:
    profiles: ["scan"]
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-moondream}"]

volumes:
  db_data:
  api_uploads:
  api_backups:
  ollama_data:
