services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-glou}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-glou_secret}
      POSTGRES_DB: ${DB_NAME:-glou_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-glou} -d ${DB_NAME:-glou_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "5432:5432"

  api:
    image: ghcr.io/jackthomasanderson/glou-server-api:beta
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${DB_USER:-glou}:${DB_PASSWORD:-glou_secret}@db:5432/${DB_NAME:-glou_db}
      JWT_SECRET: ${JWT_SECRET}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY}
      APP_URL: ${APP_URL:-http://localhost:3000}
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - api_uploads:/app/uploads
      # FEAT-18: scheduled pg_dump backups, on their own named volume, outside
      # the container filesystem (design.md "Sauvegarde & Migration").
      - api_backups:/app/backups

  web:
    image: ghcr.io/jackthomasanderson/glou-server-web:beta
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:3001}
    ports:
      - "3000:3000"

volumes:
  db_data:
  api_uploads:
  api_backups:
