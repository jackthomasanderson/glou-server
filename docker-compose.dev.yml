services:
  db:
    image: postgres:15-alpine@sha256:aae6554de426ae1990f1a939ff183a0299146cf7142a6f4c379c3357af9cc2d8
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-glou}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set. Copy .env.example to .env and set a real DB_PASSWORD before starting.}
      POSTGRES_DB: ${DB_NAME:-glou_db}
    command: ["postgres", "-c", "max_connections=20", "-c", "shared_buffers=64MB"]
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-glou} -d ${DB_NAME:-glou_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    expose:
      - "5432"
    # Rotated like the production stack: without a limit, json-file logs grow
    # until the disk is full (#231).
    logging: &logging
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: ghcr.io/jackthomasanderson/glou-server-api:beta
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${DB_USER:-glou}:${DB_PASSWORD:?DB_PASSWORD is not set. Copy .env.example to .env and set a real DB_PASSWORD before starting.}@db:5432/${DB_NAME:-glou_db}
      JWT_SECRET: ${JWT_SECRET}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Extra browser addresses allowed to send requests (comma-separated), e.g. a second hostname. Empty = APP_URL only (plus the host the request was addressed to).
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      # Members' quiet hours and the scheduled jobs are read in this time zone (#575).
      TZ: ${TZ:-Europe/Paris}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-moondream}
      # Requests allowed per address every 15 min on the API and uploads. Empty = 1000;
      # raise it to run the whole Playwright suite against this stack.
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-}
      PORT: 3001
    # Loopback only (#608): this stack runs in development mode, where the
    # public example secrets of .env.example are accepted with a warning, so
    # anyone on the same network could forge a token. Same as docker-compose.e2e.yml.
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - api_uploads:/app/uploads
      - api_backups:/app/backups
    logging: *logging

  web:
    image: ghcr.io/jackthomasanderson/glou-server-web:beta
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:3001}
      # #979: reverse proxies in front of web (default 1; 0 = reached directly).
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
    ports:
      - "127.0.0.1:3000:3000"
    logging: *logging

  # Optional label scan: docker compose -f docker-compose.dev.yml --profile scan up -d
  ollama:
    profiles: ["scan"]
    image: ollama/ollama:0.40.16
    restart: unless-stopped
    mem_limit: 4g
    environment:
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  ollama-pull:
    profiles: ["scan"]
    image: ollama/ollama:0.40.16
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-moondream}"]
    logging: *logging

volumes:
  db_data:
  api_uploads:
  api_backups:
  ollama_data:
