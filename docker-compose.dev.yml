services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-glou}
      # Security hardening — see docker-compose.yml for the full rationale:
      # no fallback secret, `docker compose` fails fast if DB_PASSWORD isn't
      # set in .env instead of silently using the known "glou_secret" default.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set. Copy .env.example to .env and set a real DB_PASSWORD before starting.}
      POSTGRES_DB: ${DB_NAME:-glou_db}
    # Memory tuning — see docker-compose.yml for the full rationale (Postgres
    # 15 defaults are max_connections=100/shared_buffers=128MB; a household
    # instance needs far less).
    command: ["postgres", "-c", "max_connections=20", "-c", "shared_buffers=64MB"]
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-glou} -d ${DB_NAME:-glou_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Security hardening — see docker-compose.yml for the full rationale: not
    # exposed to the LAN/host, only reachable from other containers on this
    # compose network. Debug via `docker compose exec db psql -U ${DB_USER:-glou} -d ${DB_NAME:-glou_db}`.
    expose:
      - "5432"

  # FEAT-04: self-hosted vision LLM (moondream) for the label-scan pipeline —
  # see docker-compose.yml for the full rationale (not exposed publicly,
  # `ollama-pull` downloads the ~1.7GB model on first startup).
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # Memory tuning — see docker-compose.yml for the full rationale: unload
    # the model after 5 min idle, one model / one scan at a time (no reason
    # to reserve RAM for parallel OCR in a single-household instance).
    environment:
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  ollama-pull:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    command: ["pull", "moondream"]

  api:
    image: ghcr.io/jackthomasanderson/glou-server-api:beta
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # Security hardening: matches the `db` service, same guard on the
      # embedded password (see docker-compose.yml for the full rationale).
      DATABASE_URL: postgresql://${DB_USER:-glou}:${DB_PASSWORD:?DB_PASSWORD is not set. Copy .env.example to .env and set a real DB_PASSWORD before starting.}@db:5432/${DB_NAME:-glou_db}
      JWT_SECRET: ${JWT_SECRET}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY}
      APP_URL: ${APP_URL:-http://localhost:3000}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - api_uploads:/app/uploads
      # FEAT-18: scheduled pg_dump backups, on their own named volume, outside
      # the container filesystem (design.md "Sauvegarde & Migration").
      - api_backups:/app/backups

  web:
    image: ghcr.io/jackthomasanderson/glou-server-web:beta
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:3001}
    ports:
      - "3000:3000"

volumes:
  db_data:
  api_uploads:
  api_backups:
  ollama_data:
