<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Chargement">
  <title>Chargement</title>
  <defs>
    <clipPath id="gclip"><path d="M18 64 H54 L50 36 H22 Z"/></clipPath>
  </defs>

  <!-- glass outline -->
  <path d="M36 64v20M18 64h36l-4-28H22z"
        stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- animated fill (CSS controls transform/opacity) -->
  <g clip-path="url(#gclip)">
    <rect class="loader-fill" x="20" y="36" width="32" height="28" fill="currentColor" opacity="0.9"/>
  </g>

  <!-- drop -->
  <circle class="loader-drop" cx="52" cy="20" r="3.2" fill="currentColor" />

</svg>
